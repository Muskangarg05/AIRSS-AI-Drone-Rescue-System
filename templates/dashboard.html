<!-- templates/dashboard.html -->
<!-- AI Rescue Drone — Mission Dashboard -->
<!-- Auto-refreshes stats + logs every 2 seconds via fetch() -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚁 Drone Rescue Dashboard</title>
  <style>
    /* ── Reset + Base ──────────────────────── */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top Header Bar ────────────────────── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      border-bottom: 2px solid #e74c3c;
      padding: 10px 24px;
      height: 54px;
    }
    .header h1 {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #e74c3c;
      text-transform: uppercase;
    }
    .header .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aaa;
    }
    .pulse {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #2ecc71;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(1.4); }
    }
    .pulse.inactive { background:#e74c3c; animation:none; }

    /* ── Main Grid ─────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 10px;
      height: calc(100vh - 54px);
    }

    /* ── Stats Bar ─────────────────────────── */
    .stats-bar {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
    }
    .stat-card {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-card .label {
      font-size: 0.7rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }
    .stat-card.alert .value { color: #e74c3c; }
    .stat-card.ok    .value { color: #2ecc71; }
    .stat-card.info  .value { color: #3498db; }

    /* ── Video Panel ───────────────────────── */
    .video-panel {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel-title {
      background: #1a1a1a;
      padding: 8px 14px;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid #2a2a2a;
    }
    .video-panel img {
      width: 100%;
      flex: 1;
      object-fit: cover;
      display: block;
    }

    /* ── Right Column ──────────────────────── */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Map Panel ─────────────────────────── */
    .map-panel {
      flex: 1;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .map-panel iframe {
      flex: 1;
      border: none;
      width: 100%;
    }

    /* ── Log Panel ─────────────────────────── */
    .log-panel {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      max-height: 210px;
    }
    .log-body {
      overflow-y: auto;
      flex: 1;
      padding: 0;
    }
    .log-body::-webkit-scrollbar { width: 4px; }
    .log-body::-webkit-scrollbar-track { background: #111; }
    .log-body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .log-entry {
      display: grid;
      grid-template-columns: 130px 60px 1fr;
      gap: 8px;
      padding: 7px 14px;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.72rem;
      transition: background 0.2s;
    }
    .log-entry:hover { background: #1a1a1a; }
    .log-entry:first-child {
      background: #1a0a0a;
      border-left: 3px solid #e74c3c;
    }
    .log-entry .ts   { color: #777; }
    .log-entry .cnt  { color: #e74c3c; font-weight: 700; text-align:center; }
    .log-entry .conf { color: #aaa; white-space: nowrap; overflow:hidden;
                       text-overflow:ellipsis; }
    .log-header {
      display: grid;
      grid-template-columns: 130px 60px 1fr;
      gap: 8px;
      padding: 6px 14px;
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #222;
    }

    /* ── Responsive ────────────────────────── */
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
      .right-col { flex-direction: row; }
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────── -->
  <div class="header">
    <h1>🚁 AI Rescue And Support System — Mission Control</h1>
    <div class="status">
      <div class="pulse" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <!-- ── Main Grid ────────────────────────── -->
  <div class="grid">

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card alert">
        <div class="label">⚠️ Current Survivors</div>
        <div class="value" id="currentCount">—</div>
      </div>
      <div class="stat-card ok">
        <div class="label">📊 Total Detected</div>
        <div class="value" id="totalCount">—</div>
      </div>
      <div class="stat-card info">
        <div class="label">🎞️ FPS</div>
        <div class="value" id="fps">—</div>
      </div>
      <div class="stat-card">
        <div class="label">📋 Detection Events</div>
        <div class="value" id="events">—</div>
      </div>
      <div class="stat-card">
        <div class="label">🕒 Mission Start</div>
        <div class="value" style="font-size:0.9rem;" id="missionStart">—</div>
      </div>
    </div>

    <!-- Live Video -->
    <div class="video-panel">
      <div class="panel-title">📹 Live Drone Feed — YOLOv8 Detection</div>
      <img src="/video_feed" alt="Live Feed">
    </div>

    <!-- Right Column: Map + Log -->
    <div class="right-col">

      <!-- Folium Map -->
      <div class="map-panel">
        <div class="panel-title">📍 Survivor GPS Map</div>
        <iframe id="mapFrame" src="/map" title="Survivor Map"></iframe>
      </div>

      <!-- Detection Log -->
      <div class="log-panel">
        <div class="panel-title">📋 Mission Detection Log</div>
        <div class="log-header">
          <span>Timestamp</span>
          <span style="text-align:center;">Count</span>
          <span>Confidence</span>
        </div>
        <div class="log-body" id="logBody">
          <div class="log-entry">
            <span class="ts">Waiting...</span>
            <span class="cnt">—</span>
            <span class="conf">No detections yet</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ── JavaScript: Live Polling ─────────── -->
  <script>
    const STATUS_DOT  = document.getElementById("statusDot");
    const STATUS_TEXT = document.getElementById("statusText");

    let lastEventCount = 0;   // Tracks map refresh trigger
    let mapRefreshTimer = null;

    // ── Poll /api/stats every 2 seconds ──────
    async function fetchStats() {
      try {
        const res  = await fetch("/api/stats");
        const data = await res.json();

        document.getElementById("currentCount").textContent =
          data.survivor_count ?? "—";
        document.getElementById("totalCount").textContent =
          data.total_survivors ?? "—";
        document.getElementById("fps").textContent =
          data.fps?.toFixed(1) ?? "—";
        document.getElementById("events").textContent =
          data.total_events ?? "—";
        document.getElementById("missionStart").textContent =
          data.mission_start?.slice(11, 19) ?? "—"; // Show time only

        // ── Update status indicator ──────────
        if (data.is_active) {
          STATUS_DOT.className  = "pulse";
          STATUS_TEXT.textContent = "🟢 LIVE";
        } else {
          STATUS_DOT.className  = "pulse inactive";
          STATUS_TEXT.textContent = "⚫ Offline";
        }

        // ── Refresh map iframe on new event ──
        if (data.total_events > lastEventCount) {
          lastEventCount = data.total_events;
          clearTimeout(mapRefreshTimer);
          mapRefreshTimer = setTimeout(() => {
            document.getElementById("mapFrame").src =
              "/map?t=" + Date.now();   // Cache-bust
          }, 1000);
        }

      } catch (e) {
        STATUS_DOT.className  = "pulse inactive";
        STATUS_TEXT.textContent = "⚠️ Connection Error";
      }
    }

    // ── Poll /api/logs every 2 seconds ────────
    async function fetchLogs() {
      try {
        const res  = await fetch("/api/logs");
        const logs = await res.json();
        const body = document.getElementById("logBody");

        if (!logs || logs.length === 0) return;

        body.innerHTML = logs.map((e, i) => `
          <div class="log-entry">
            <span class="ts">${(e.timestamp || "").slice(11, 19)}</span>
            <span class="cnt">${e.survivor_count ?? "?"}</span>
            <span class="conf">${
              Array.isArray(e.confidences)
                ? e.confidences.map(c => c.toFixed(2)).join(", ")
                : (e.confidences || "—")
            }</span>
          </div>
        `).join("");

      } catch (e) { /* Silent fail on log fetch */ }
    }

    // ── Start polling ─────────────────────────
    fetchStats();
    fetchLogs();
    setInterval(fetchStats, 2000);
    setInterval(fetchLogs,  2000);
  </script>

</body>
</html>
